<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argon Monitoring · iwb TUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:#0a0e16;color:#e9f0fb;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes argpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  @keyframes argblink{0%,100%{opacity:.55}50%{opacity:1}}
  button{font-family:inherit}
</style>
</head>
<body>
  <div id="root"></div>
  <!-- Cache-Bust: lädt immer die aktuelle app.js (kleine Datei, LAN-Dashboard) -->
  <script>(function(){var s=document.createElement('script');s.src='app.js?v='+Date.now();document.body.appendChild(s);})();</script>
</body>
</html>
