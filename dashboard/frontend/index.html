<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Monitoring · iwb TUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Design-Tokens des iwb-Gas-Monitoring-Redesigns (Handoff 2026-08) */
  :root{
    --bg:#eef1f6; --panel:#ffffff; --border:#e3e8f0; --divider:#eef1f6;
    --text:#101c2e; --dim:#4a586b; --mute:#93a1b4;
    --brand:#0065BD; --brand-tint:#e8f1fb; --accent2:#0e9aa7;
    --good:#15a34a; --good-bg:#e8f7ee;
    --warn:#d97706; --warn-bg:#fef3e2; --warn-bg2:#fffbeb; --warn-border:#fde8c8; --warn-border2:#f5d9a8;
    --danger:#dc2626; --danger-bg:#fdecec; --danger-bg2:#fef2f2; --danger-border:#fecaca; --danger-border2:#f3b8b8;
    --grid:rgba(16,28,46,.07); --shadow:0 1px 3px rgba(16,28,46,.05);
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:#cdd6e2;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  @keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  button{font-family:inherit;color:inherit}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
  .card-chart{padding:18px 20px}
  .card-table{padding:0;overflow:hidden}
  .kpi-label{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:600;text-transform:uppercase}
  .kpi-value{font:600 28px var(--mono);margin:9px 0 4px;letter-spacing:-.01em}
  .kpi-sub{font-size:12px;color:var(--dim)}
  .micro{font-size:9.5px;letter-spacing:.14em;color:var(--mute);font-weight:600;text-transform:uppercase}
  .card-title{font-size:13.5px;font-weight:700}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;flex:none}
  .seg button{padding:5px 11px;border-radius:6px;font:600 12px var(--mono);border:none;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--brand);color:#fff}
  .seg button:hover:not(.on){background:var(--divider)}

  .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(16,28,46,.05);white-space:nowrap}
  .btn:hover{background:#f7f9fc}
  .btn-primary{border:none;background:var(--brand);color:#fff;border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-primary:hover{background:#005aa8}
  .btn-danger{border:1px solid var(--danger);background:transparent;color:var(--danger);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer}
  .btn-link{border:none;background:none;color:var(--brand);font-size:11.5px;font-weight:600;cursor:pointer;padding:0}
  .btn-link:hover{text-decoration:underline}
  .btn-link.gray{color:var(--dim)}

  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{text-align:left;padding:8px 12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
  table.tbl th.r, table.tbl td.r{text-align:right}
  table.tbl th:first-child, table.tbl td:first-child{padding-left:20px}
  table.tbl th:last-child, table.tbl td:last-child{padding-right:20px}
  table.tbl td{padding:8px 12px;border-bottom:1px solid var(--divider);font-size:12px}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tbody tr.click{cursor:pointer}
  table.tbl tbody tr.click:hover{background:#f7f9fc}
  th.sort{cursor:pointer}

  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--dim);font-size:12.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent}
  .nav-item:hover{background:#f4f7fb}
  .nav-item.on{background:var(--brand-tint);color:var(--brand);font-weight:600;border-left:2px solid var(--brand)}

  .inp{background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:12.5px;width:100%;font-family:var(--sans)}
  .inp:focus{outline:none;border-color:var(--brand)}
  .inp.mono{font-family:var(--mono)}
  .lbl{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:5px}
  .chk{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
  .pill{font:600 10px var(--mono);padding:3px 8px;border-radius:6px;white-space:nowrap}
  .mono{font-family:var(--mono)}
</style>
</head>
<body>
  <div id="root"></div>
  <!-- Cache-Bust: lädt immer die aktuelle app.js (kleine Datei, LAN-Dashboard) -->
  <script>(function(){var s=document.createElement('script');s.src='app.js?v='+Date.now();document.body.appendChild(s);})();</script>
</body>
</html>
