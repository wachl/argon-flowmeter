# Gerätedatei = Konfiguration dieser einen Messstelle. Direkt hier editieren.
# Gemeinsame Logik (Pins, MQTT, Zähler): ../gas-flowmeter.yaml
substitutions:
  device_name: "gas-flow-11"
  friendly_name: "Gas Flow 11 – Anlage 11"
  # machine_id = Sensor-ID im Dashboard und in den MQTT-Topics (iwb/gas/<machine_id>/...)
  machine_id: "anlage-11"
  # Pulswertigkeit (Nl/Puls) = am Festo-SFAH eingestellter Schwellwert "SP".
  # MUSS exakt dem Sensor-SP entsprechen! (Anleitung, Abschnitt 4)
  liter_per_pulse: "1.0"

packages:
  common: !include ../gas-flowmeter.yaml
