# =============================================================================
#  Gas-Durchflussmesser (Argon, Stickstoff, ...)  –  EINE Firmware fuer alle
#  Geraete. Olimex ESP32-POE2 (WROVER-E N4R8) + Festo SFAH (Volumenpuls).
#  iwb / TUM
#
#  Diese Datei wird DIREKT geflasht (esphome run gas-flowmeter.yaml) — es gibt
#  keine Geraete-Dateien mehr. Identitaet und Kennwerte kommen zur Laufzeit:
#   - Hostname   = gas-flow-<MAC-Suffix>  (eindeutig je Geraet)
#   - IP         = vom DHCP an die eindeutige MAC vergeben (im Router
#                  reservieren -> stabile IP je Geraet)
#   - Anlagen-ID (= Sensor-ID im Dashboard und in den MQTT-Topics) und
#     SP-Wert (Nl/Puls, muss dem Festo-SP entsprechen) werden im
#     Geraete-Webinterface  http://<IP>/  eingestellt und ueberleben
#     Reboot/Stromausfall (NVS). Ohne konfigurierte Anlagen-ID publiziert das
#     Geraet als "gas-<MAC-Suffix>" und erscheint im Dashboard automatisch
#     als "nicht zugeordnet".
#
#  Alle MQTT-Topics entstehen zur Laufzeit aus der Anlagen-ID
#  (iwb/gas/<anlagen-id>/...); die eingebaute Topic-Ableitung von ESPHome ist
#  deshalb deaktiviert (topic_prefix: null) und LWT/Birth werden beim Boot per
#  Lambda gesetzt (siehe on_boot).
#
#  Verifizierte Hardware-Fakten (Stand Olimex-Handbuch Rev. 2.7 / Festo SFAH 2025-02d):
#   - Ethernet-Takt liegt auf GPIO0 (WROVER!), Modus CLK_OUT  -> offizielles
#     Olimex-Beispiel SOFTWARE/ESPHOME/esp32-poe2.yaml + Arduino ETH_CLOCK_GPIO0_OUT
#   - PHY-Power auf GPIO12, MDC=GPIO23, MDIO=GPIO18, LAN8720, phy_addr 0
#   - Pulssignal auf GPIO4 (= UEXT Pin 3 / EXT1 Pin 19), kein Onboard-Pullup
# =============================================================================

# ---- Hardware-Konstanten (fuer alle Geraete identisch)
substitutions:
  # Pin des Volumenpulses
  pulse_pin: "GPIO4"
  # Entprellung: kleiner als die Festo-Pulsbreite PULS (real 75 ms, Werk 100 ms),
  # groesser als Schaltflanken/Stoerungen.
  pulse_filter: "30ms"
  # Wird laenger als diese Zeit kein Puls gesehen, gilt der Durchfluss als 0.
  # Kurz halten: pulse_meter haelt sonst nach dem letzten Puls minutenlang den
  # letzten Momentanwert ("Phantom-Fluss"). Bei sehr kleinem SP ggf. erhoehen.
  flow_timeout: "90s"

esphome:
  name: gas-flow
  # Eindeutiger Hostname je Geraet: gas-flow-<letzte 3 MAC-Oktette>
  name_add_mac_suffix: true
  friendly_name: Gas Flow
  comment: "Gas-Durchflussmesser (Olimex ESP32-POE2 + Festo SFAH), Einheits-Firmware"
  includes:
    - gas_id.h
  on_boot:
    # Prio 600: nach dem NVS-Restore der Template-Entitaeten und globals
    # (Setup-Prio 800), aber vor dem MQTT-Setup (Prio 250). Nur hier lassen
    # sich LWT/Birth auf die Laufzeit-Topics setzen — sie werden beim
    # Verbinden uebertragen und sind danach fix.
    - priority: 600
      then:
        - lambda: |-
            id(active_id) = gas_machine_id(id(machine_id_cfg).state);
            id(booted) = true;
            ESP_LOGI("gas", "Anlagen-ID: %s", id(active_id).c_str());

            std::string st = "iwb/gas/" + id(active_id) + "/status";
            mqtt::MQTTMessage birth;
            birth.topic = st; birth.payload = "online"; birth.qos = 0; birth.retain = true;
            mqtt::global_mqtt_client->set_birth_message(std::move(birth));
            mqtt::MQTTMessage will;
            will.topic = st; will.payload = "offline"; will.qos = 0; will.retain = true;
            mqtt::global_mqtt_client->set_last_will(std::move(will));
            mqtt::MQTTMessage down;
            down.topic = st; down.payload = "offline"; down.qos = 0; down.retain = true;
            mqtt::global_mqtt_client->set_shutdown_message(std::move(down));

            // Reset-Kommando: Wildcard-Subscription, Filterung auf die eigene
            // (zur Laufzeit aenderbare) ID im Callback. Die Subscription wird
            // von ESPHome bei jedem Reconnect automatisch erneuert.
            mqtt::global_mqtt_client->subscribe(
                "iwb/gas/+/cmd",
                [](const std::string &topic, const std::string &payload) {
                  if (topic != gas_topic(id(machine_id_cfg).state, "cmd"))
                    return;
                  if (payload == "reset") {
                    // WICHTIG: auch das interne pulse_meter-Sitzungstotal
                    // nullen, sonst addiert der naechste Puls das komplette
                    // Sitzungsvolumen wieder auf (delta = x - last_raw).
                    id(gas_flow).set_total_pulses(0);
                    id(vol_total) = 0.0f;
                    id(last_raw) = 0.0f;
                    id(total_vol).update();
                    ESP_LOGI("gas", "Gesamtvolumen via MQTT-Kommando zurueckgesetzt");
                  }
                });

esp32:
  board: esp32dev
  framework:
    type: arduino

# WROVER-E N4R8 hat 8 MB PSRAM (wie offizielles Olimex-Beispiel)
psram:
  mode: quad
  speed: 80MHz

# Zaehlerstand (globals mit restore_value) alle 10 s statt 60 s ins NVS sichern:
# begrenzt den Rueckwaertssprung des Zaehlers nach hartem Stromausfall.
# Geschrieben wird nur bei geaendertem Wert -> NVS-Verschleiss unkritisch.
preferences:
  flash_write_interval: 10s

# ----------------------------------------------------------------------------
#  Netzwerk: nur Ethernet (PoE). WiFi und Ethernet sind in ESPHome nicht
#  gleichzeitig nutzbar -> fuer PoE bewusst kein wifi:-Block.
#  Takt-Pin GPIO0 / CLK_OUT ist die WROVER-Besonderheit des POE2.
# ----------------------------------------------------------------------------
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:
  level: INFO

# ----------------------------------------------------------------------------
#  Verwaltung / Fernzugriff
#  - api: fuer ESPHome-Dashboard (Live-Logs, Status) und optional Home Assistant
#         WICHTIG: reboot_timeout 0s, sonst rebootet das Geraet alle 15 min,
#         wenn KEIN Home-Assistant-Client verbunden ist (reiner MQTT-Betrieb).
#  - ota: Firmware-Updates ueber Ethernet (kein USB-Stecken mehr noetig)
#  - web_server: Konfigurations- und Status-Seite je Geraet (Port 80).
#         local: true -> JS liegt im Geraet, funktioniert ohne Internetzugang.
# ----------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true

time:
  - platform: sntp
    id: sntp_time

# ----------------------------------------------------------------------------
#  MQTT (fuer das kundenspezifische Dashboard / herstellerunabhaengige Anbindung)
#  Topics je Anlage: iwb/gas/<anlagen-id>/{status,flow,total,voltage,uptime,meta}
#  Kommandos (Reset): iwb/gas/<anlagen-id>/cmd  ->  "reset"
#  topic_prefix: null -> keine automatischen ESPHome-Topics; alles laeuft ueber
#  die Laufzeit-Publishes unten (die Anlagen-ID ist erst zur Laufzeit bekannt).
# ----------------------------------------------------------------------------
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: null
  discovery: false
  on_connect:
    - script.execute: publish_meta

# ----------------------------------------------------------------------------
#  Laufzeit-Konfiguration (Geraete-Webinterface, NVS-persistent)
# ----------------------------------------------------------------------------
number:
  # Pulswertigkeit = der am Festo-SFAH eingestellte Schwellwert "SP"
  # (Normvolumen je Puls, Einheit Nl). MUSS exakt dem Sensor-SP entsprechen!
  # Wirkt sofort (kein Neustart, kein Neu-Flashen) und nur auf kuenftige Pulse.
  - platform: template
    name: "SP-Wert (Nl pro Puls)"
    id: sp_value
    entity_category: config
    icon: "mdi:counter"
    unit_of_measurement: "Nl"
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.001
    max_value: 1000.0
    step: 0.001
    mode: box
    on_value:
      - script.execute: publish_meta

text:
  # Anlagen-ID = Sensor-ID im Dashboard und in den MQTT-Topics.
  # Leer lassen -> MAC-basierte ID (gas-<MAC-Suffix>). Eine Aenderung raeumt
  # die alten retained Topics ab und startet das Geraet neu (LWT/Birth lassen
  # sich nur beim Verbinden setzen). Erlaubt: A-Za-z0-9_- (Rest wird entfernt).
  - platform: template
    name: "Anlagen-ID"
    id: machine_id_cfg
    entity_category: config
    icon: "mdi:identifier"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      # booted-Guard: beim NVS-Restore im Boot nicht neu starten
      - if:
          condition:
            lambda: return id(booted);
          then:
            - script.execute: apply_machine_id

script:
  # Geraete-Metadaten als retained JSON: das Dashboard zeigt daraus IP-Link,
  # SP-Wert, Hostname und Firmware im Sensor-Manager.
  - id: publish_meta
    mode: restart
    then:
      - lambda: |-
          if (!mqtt::global_mqtt_client->is_connected())
            return;
          std::string ip;
          for (auto &addr : network::get_ip_addresses()) {
            if (addr.is_set() && addr.is_ip4()) { ip = addr.str(); break; }
          }
          std::string payload = "{\"ip\":\"" + ip +
              "\",\"mac\":\"" + get_mac_address_pretty() +
              "\",\"hostname\":\"" + App.get_name() +
              "\",\"sp\":" + str_sprintf("%.3f", id(sp_value).state) +
              ",\"fw\":\"" ESPHOME_VERSION " (" + App.get_compilation_time() + ")\"}";
          mqtt::global_mqtt_client->publish(
              gas_topic(id(machine_id_cfg).state, "meta"), payload, 0, true);

  # Geaenderte Anlagen-ID uebernehmen: alte retained Topics abraeumen, NVS
  # syncen, Neustart. mode: restart -> beim Tippen zaehlt nur die letzte Eingabe.
  - id: apply_machine_id
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (gas_machine_id(id(machine_id_cfg).state) == id(active_id))
            return;
          // LWT/Shutdown-Message zeigen noch auf das alte Status-Topic und
          // wuerden es beim Reboot als retained "offline" wieder anlegen ->
          // vor dem Abraeumen deaktivieren (on_boot setzt sie nach dem
          // Neustart frisch auf die neue ID).
          mqtt::global_mqtt_client->disable_last_will();
          mqtt::global_mqtt_client->disable_shutdown_message();
          if (mqtt::global_mqtt_client->is_connected()) {
            // Leere retained Publishes loeschen die alten Topics beim Broker
            // (das Backend ignoriert leere Payloads). WICHTIG: Payload als
            // std::string uebergeben - ein ""-Literal wuerde die
            // (payload, payload_length, qos, retain)-Ueberladung treffen und
            // retain=false senden (loescht nichts).
            for (const char *leaf : {"status", "flow", "total", "voltage", "uptime", "meta"}) {
              mqtt::global_mqtt_client->publish(
                  "iwb/gas/" + id(active_id) + "/" + leaf, std::string(), 0, true);
            }
          }
          global_preferences->sync();
      # Publishes sicher rausschreiben lassen, dann neu starten
      - delay: 3s
      - lambda: |-
          if (gas_machine_id(id(machine_id_cfg).state) != id(active_id)) {
            ESP_LOGI("gas", "Anlagen-ID geaendert -> Neustart mit neuer ID");
            App.safe_reboot();
          }

interval:
  - interval: 60s
    then:
      - script.execute: publish_meta

# ----------------------------------------------------------------------------
#  Zaehlerlogik
#  vol_total  : lebenslanges Gesamtvolumen, ueberlebt Reboot/Stromausfall
#               (restore_value -> Flash/NVS, von ESPHome periodisch gesichert)
#  last_raw   : Spiegel des fluechtigen pulse_meter-Totals in ROHEN Pulsen
#               (NICHT persistent); wird bei jedem Boot wie das
#               pulse_meter-Total auf 0 gesetzt.
# ----------------------------------------------------------------------------
globals:
  - id: vol_total
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: last_raw
    type: float
    restore_value: false
    initial_value: "0.0"
  # Debug-Live-Anzeige des Puls-Eingangs
  - id: last_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: pulse_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # true ab on_boot Prio 600 — unterscheidet NVS-Restore von echten Eingaben
  - id: booted
    type: bool
    restore_value: false
    initial_value: "false"
  # beim Boot fixierte, aktive Anlagen-ID (Topics/LWT laufen darauf)
  - id: active_id
    type: std::string
    restore_value: false
    initial_value: '""'

sensor:
  # ---- Momentaner Durchfluss --------------------------------------------------
  # pulse_meter misst die Zeit zwischen Pulsen und meldet standardmaessig
  # "Pulse/min". x SP-Wert  ->  Nl/min.
  - platform: pulse_meter
    pin:
      number: ${pulse_pin}
      mode:
        input: true
        pullup: true        # zusaetzlich externer Pull-up empfohlen (NPN braucht >=2 mA Last)
    name: "Durchfluss"
    id: gas_flow
    unit_of_measurement: "Nl/min"
    device_class: volume_flow_rate
    state_class: measurement
    icon: "mdi:gauge"
    accuracy_decimals: 2
    internal_filter: ${pulse_filter}
    # PULSE: zaehlt nur Pegel, die >= internal_filter stabil anliegen (Festo-Puls
    # PULS = 75-100 ms). Kurze Stoerspitzen, die im EDGE-Modus als Puls zaehlen
    # wuerden (Geisterverbrauch), fallen damit raus.
    internal_filter_mode: PULSE
    timeout: ${flow_timeout}
    filters:
      - lambda: return x * id(sp_value).state;
    on_value:
      - lambda: |-
          mqtt::global_mqtt_client->publish(
              gas_topic(id(machine_id_cfg).state, "flow"), str_sprintf("%.2f", x), 0, true);
    # Das fluechtige Sitzungs-Total nutzen wir nur intern, um daraus das
    # persistente Gesamtvolumen zu bilden. Bewusst UNSKALIERT (rohe Pulse):
    # erst das Delta wird mit dem aktuellen SP-Wert bewertet — eine
    # SP-Aenderung wirkt so nur auf kuenftige Pulse, nicht rueckwirkend.
    total:
      name: "Pulse (roh, Sitzung)"
      id: session_pulses
      unit_of_measurement: "Pulse"
      accuracy_decimals: 0
      icon: "mdi:counter"
      internal: true
      on_value:
        - lambda: |-
            float delta = x - id(last_raw);
            if (delta < 0) delta = x;   // Schutz, falls pulse_meter intern resettet
            id(last_raw) = x;
            // Beim Boot publiziert pulse_meter einmal total=0 (kein echter Puls).
            // Volumen/Debug-Zaehler nur bei echtem Pulszuwachs anstossen.
            if (delta > 0) {
              id(vol_total) += delta * id(sp_value).state;
              id(last_pulse_ms) = millis();
              id(pulse_count) += (uint32_t) lroundf(delta);
            }
        - component.update: total_vol

  # ---- Persistentes Gesamtvolumen --------------------------------------------
  - platform: template
    name: "Gesamtvolumen"
    id: total_vol
    unit_of_measurement: "Nl"
    state_class: total_increasing
    accuracy_decimals: 1
    icon: "mdi:sigma"
    lambda: "return id(vol_total);"
    update_interval: 5s
    on_value:
      - lambda: |-
          mqtt::global_mqtt_client->publish(
              gas_topic(id(machine_id_cfg).state, "total"), str_sprintf("%.1f", x), 0, true);

  # ---- Diagnose: Betriebsspannung am EXT-Anschluss (GPI39, Teiler 47k/100k) ---
  - platform: adc
    pin: GPIO39
    name: "Versorgungsspannung (Sense)"
    attenuation: 12db
    update_interval: 60s
    entity_category: diagnostic
    filters:
      # R2=47k / R8=100k -> Vin = Vadc * (47+100)/100 = Vadc * 1.47
      - multiply: 1.47
    on_value:
      - lambda: |-
          mqtt::global_mqtt_client->publish(
              gas_topic(id(machine_id_cfg).state, "voltage"), str_sprintf("%.2f", x), 0, true);

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    on_value:
      - lambda: |-
          mqtt::global_mqtt_client->publish(
              gas_topic(id(machine_id_cfg).state, "uptime"), str_sprintf("%.0f", x), 0, true);

  # ---- Debug: Live-Pulszaehler (im Web-Dashboard hochzaehlen sehen) -----------
  # Zum Verdrahtungs-/Sensortest: Sensor ausloesen -> Zaehler steigt.
  - platform: template
    name: "Pulse (Sitzung)"
    id: puls_count_sensor
    unit_of_measurement: "Pulse"
    accuracy_decimals: 0
    icon: "mdi:pulse"
    entity_category: diagnostic
    lambda: "return id(pulse_count);"
    update_interval: 1s

# ----------------------------------------------------------------------------
#  Status-/Identitaets-Anzeige im Geraete-Webinterface
# ----------------------------------------------------------------------------
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP-Adresse"
    mac_address:
      name: "MAC-Adresse (Ethernet)"
  - platform: version
    name: "Firmware"
    hide_timestamp: true
  # Effektive ID inkl. MAC-Fallback — das ist die ID, unter der das Geraet
  # im Dashboard und in den MQTT-Topics erscheint.
  - platform: template
    name: "Anlagen-ID (aktiv)"
    entity_category: diagnostic
    icon: "mdi:identifier"
    lambda: return gas_machine_id(id(machine_id_cfg).state);
    update_interval: 10s

# Online/Offline-Verfuegbarkeit kommt aus dem retained LWT-Topic .../status
# (Birth/Will werden in on_boot auf die Laufzeit-Topics gesetzt).

# ----------------------------------------------------------------------------
#  Live-Anzeige des Puls-Eingangs im eingebauten Web-Dashboard (Debug).
#  "Puls-Eingang aktiv" leuchtet, solange Pulse eintreffen (letzter Puls < 400 ms).
#  Getrieben aus den echten Puls-Events – pulse_meter belegt GPIO4 exklusiv, daher
#  keine zweite GPIO-Belegung auf demselben Pin moeglich.
# ----------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Puls-Eingang aktiv"
    id: puls_input_active
    device_class: running
    lambda: |-
      return id(last_pulse_ms) != 0 && (millis() - id(last_pulse_ms)) < 400;

button:
  # Reset auch ueber Webinterface/API/ESPHome-Dashboard/Home Assistant moeglich
  - platform: template
    name: "Gesamtvolumen zuruecksetzen"
    icon: "mdi:restart"
    entity_category: config
    on_press:
      # wie beim MQTT-Reset: pulse_meter-Sitzungstotal mit nullen
      - pulse_meter.set_total_pulses:
          id: gas_flow
          value: 0
      - lambda: |-
          id(vol_total) = 0.0;
          id(last_raw) = 0.0;
      - component.update: total_vol
      - logger.log: "Gesamtvolumen via Button zurueckgesetzt"
