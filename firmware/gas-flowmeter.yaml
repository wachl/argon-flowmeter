# =============================================================================
#  Gas-Durchflussmesser (Argon, Stickstoff, ...)  –  gemeinsames ESPHome-Package
#  Olimex ESP32-POE2 (WROVER-E N4R8)  +  Festo SFAH (Volumenpuls-Ausgang)
#  iwb / TUM
#
#  Die Firmware ist gas-neutral: WELCHES Gas eine Anlage verbraucht, wird erst
#  im Dashboard zugeordnet (Sensor-Manager). Hier zaehlt nur der Volumenpuls.
#
#  Diese Datei wird NICHT direkt geflasht. Sie wird von den Geräte-Dateien
#  unter  devices/gas-flow-XX.yaml  via  packages:  eingebunden.
#  Jede Geräte-Datei setzt nur ihre eigenen substitutions (Name, SP-Wert ...).
#
#  Verifizierte Hardware-Fakten (Stand Olimex-Handbuch Rev. 2.7 / Festo SFAH 2025-02d):
#   - Ethernet-Takt liegt auf GPIO0 (WROVER!), Modus CLK_OUT  -> offizielles
#     Olimex-Beispiel SOFTWARE/ESPHOME/esp32-poe2.yaml + Arduino ETH_CLOCK_GPIO0_OUT
#   - PHY-Power auf GPIO12, MDC=GPIO23, MDIO=GPIO18, LAN8720, phy_addr 0
#   - Pulssignal auf GPIO4 (= UEXT Pin 3 / EXT1 Pin 19), kein Onboard-Pullup
# =============================================================================

# ---- Vorgabewerte; werden je Gerät in devices/gas-flow-XX.yaml überschrieben
substitutions:
  device_name: "gas-flow-xx"
  friendly_name: "Gas Flow XX"
  # machine_id geht in die MQTT-Topics ein:  iwb/gas/<machine_id>/...
  machine_id: "anlage-xx"
  # Pulswertigkeit = der am Festo-SFAH eingestellte Schwellwert "SP"
  # (Normvolumen je Puls, Einheit Nl). MUSS exakt dem Sensor-SP entsprechen!
  liter_per_pulse: "1.0"
  # Pin des Volumenpulses
  pulse_pin: "GPIO4"
  # Entprellung: kleiner als die Festo-Pulsbreite PULS (Standard 100 ms),
  # groesser als Schaltflanken/Störungen.
  pulse_filter: "30ms"
  # Wird laenger als diese Zeit kein Puls gesehen, gilt der Durchfluss als 0.
  # Kurz halten: pulse_meter haelt sonst nach dem letzten Puls minutenlang den
  # letzten Momentanwert ("Phantom-Fluss"). Bei sehr kleinem SP ggf. erhoehen.
  flow_timeout: "90s"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Gas-Durchflussmesser ${machine_id} (Olimex ESP32-POE2 + Festo SFAH)"

esp32:
  board: esp32dev
  framework:
    type: arduino

# WROVER-E N4R8 hat 8 MB PSRAM (wie offizielles Olimex-Beispiel)
psram:
  mode: quad
  speed: 80MHz

# Zaehlerstand (globals mit restore_value) alle 10 s statt 60 s ins NVS sichern:
# begrenzt den Rueckwaertssprung des Zaehlers nach hartem Stromausfall.
# Geschrieben wird nur bei geaendertem Wert -> NVS-Verschleiss unkritisch.
preferences:
  flash_write_interval: 10s

# ----------------------------------------------------------------------------
#  Netzwerk: nur Ethernet (PoE). WiFi und Ethernet sind in ESPHome nicht
#  gleichzeitig nutzbar -> fuer PoE bewusst kein wifi:-Block.
#  Takt-Pin GPIO0 / CLK_OUT ist die WROVER-Besonderheit des POE2.
# ----------------------------------------------------------------------------
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:
  level: INFO

# ----------------------------------------------------------------------------
#  Verwaltung / Fernzugriff
#  - api: fuer ESPHome-Dashboard (Live-Logs, Status) und optional Home Assistant
#         WICHTIG: reboot_timeout 0s, sonst rebootet das Geraet alle 15 min,
#         wenn KEIN Home-Assistant-Client verbunden ist (reiner MQTT-Betrieb).
#  - ota: Firmware-Updates ueber Ethernet (kein USB-Stecken mehr noetig)
#  - web_server: kleine Status-Webseite je Geraet (Port 80)
# ----------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

time:
  - platform: sntp
    id: sntp_time

# ----------------------------------------------------------------------------
#  MQTT (fuer das kundenspezifische Dashboard / herstellerunabhaengige Anbindung)
#  Topic-Praefix je Anlage, gas-neutral. Status als retained LWT (online/offline).
#  (Bestandsgeraete mit alter Firmware publizierten auf iwb/argon/<machine_id>;
#   das Dashboard-Backend versteht beide Praefixe und mappt auf dieselbe ID.)
#  ESPHome veroeffentlicht jede Entität unter:
#     iwb/gas/<machine_id>/sensor/<object_id>/state
#  Kommandos (Reset) ueber:  iwb/gas/<machine_id>/cmd
# ----------------------------------------------------------------------------
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: "iwb/gas/${machine_id}"
  birth_message:
    topic: "iwb/gas/${machine_id}/status"
    payload: "online"
    retain: true
  will_message:
    topic: "iwb/gas/${machine_id}/status"
    payload: "offline"
    retain: true
  on_message:
    # Reset des persistenten Gesamtzaehlers per:  ...<machine_id>/cmd  ->  "reset"
    - topic: "iwb/gas/${machine_id}/cmd"
      payload: "reset"
      then:
        # WICHTIG: auch das interne pulse_meter-Sitzungstotal nullen, sonst
        # addiert der naechste Puls das komplette Sitzungsvolumen wieder auf
        # (on_value: delta = x - last_raw mit last_raw = 0).
        - pulse_meter.set_total_pulses:
            id: gas_flow
            value: 0
        - lambda: |-
            id(vol_total) = 0.0;
            id(last_raw) = 0.0;
        - component.update: total_vol
        - logger.log: "Gesamtvolumen via MQTT-Kommando zurueckgesetzt"

# ----------------------------------------------------------------------------
#  Zaehlerlogik
#  vol_total  : lebenslanges Gesamtvolumen, ueberlebt Reboot/Stromausfall
#               (restore_value -> Flash/NVS, von ESPHome periodisch gesichert)
#  last_raw   : Spiegel des fluechtigen pulse_meter-Totals (NICHT persistent);
#               wird bei jedem Boot wie das pulse_meter-Total auf 0 gesetzt.
# ----------------------------------------------------------------------------
globals:
  - id: vol_total
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: last_raw
    type: float
    restore_value: false
    initial_value: "0.0"
  # Debug-Live-Anzeige des Puls-Eingangs
  - id: last_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: pulse_count
    type: uint32_t
    restore_value: false
    initial_value: "0"

sensor:
  # ---- Momentaner Durchfluss --------------------------------------------------
  # pulse_meter misst die Zeit zwischen Pulsen und meldet standardmaessig
  # "Pulse/min". x liter_per_pulse  ->  Nl/min.
  - platform: pulse_meter
    pin:
      number: ${pulse_pin}
      mode:
        input: true
        pullup: true        # zusaetzlich externer Pull-up empfohlen (NPN braucht >=2 mA Last)
    name: "Durchfluss"
    id: gas_flow
    state_topic: "iwb/gas/${machine_id}/flow"
    unit_of_measurement: "Nl/min"
    device_class: volume_flow_rate
    state_class: measurement
    icon: "mdi:gauge"
    accuracy_decimals: 2
    internal_filter: ${pulse_filter}
    # PULSE: zaehlt nur Pegel, die >= internal_filter stabil anliegen (Festo-Puls
    # PULS = 100 ms). Kurze Stoerspitzen, die im EDGE-Modus als Puls zaehlen
    # wuerden (Geisterverbrauch), fallen damit raus.
    internal_filter_mode: PULSE
    timeout: ${flow_timeout}
    filters:
      - multiply: ${liter_per_pulse}
    # Das fluechtige Sitzungs-Total (Pulse seit Boot) nutzen wir nur intern,
    # um daraus das persistente Gesamtvolumen zu bilden.
    total:
      name: "Volumen (Sitzung)"
      id: session_vol
      unit_of_measurement: "Nl"
      accuracy_decimals: 1
      icon: "mdi:counter"
      internal: true
      filters:
        - multiply: ${liter_per_pulse}
      on_value:
        - lambda: |-
            // x ist bereits das mit liter_per_pulse skalierte Sitzungsvolumen.
            float delta = x - id(last_raw);
            if (delta < 0) delta = x;   // Schutz, falls pulse_meter intern resettet
            id(last_raw) = x;
            id(vol_total) += delta;
            // Beim Boot publiziert pulse_meter einmal total=0 (kein echter Puls).
            // Debug-Zaehler/Live-Puls-Anzeige nur bei echtem Volumenzuwachs anstossen.
            if (delta > 0) {
              id(last_pulse_ms) = millis();
              id(pulse_count) += 1;
            }
        - component.update: total_vol

  # ---- Persistentes Gesamtvolumen --------------------------------------------
  - platform: template
    name: "Gesamtvolumen"
    id: total_vol
    state_topic: "iwb/gas/${machine_id}/total"
    unit_of_measurement: "Nl"
    state_class: total_increasing
    accuracy_decimals: 1
    icon: "mdi:sigma"
    lambda: "return id(vol_total);"
    update_interval: 5s

  # ---- Diagnose: Betriebsspannung am EXT-Anschluss (GPI39, Teiler 47k/100k) ---
  - platform: adc
    pin: GPIO39
    name: "Versorgungsspannung (Sense)"
    state_topic: "iwb/gas/${machine_id}/voltage"
    attenuation: 12db
    update_interval: 60s
    entity_category: diagnostic
    filters:
      # R2=47k / R8=100k -> Vin = Vadc * (47+100)/100 = Vadc * 1.47
      - multiply: 1.47

  - platform: uptime
    name: "Uptime"
    state_topic: "iwb/gas/${machine_id}/uptime"
    entity_category: diagnostic

  # ---- Debug: Live-Pulszähler (im Web-Dashboard hochzählen sehen) -------------
  # Zum Verdrahtungs-/Sensortest: Sensor auslösen -> Zähler steigt.
  - platform: template
    name: "Pulse (Sitzung)"
    id: puls_count_sensor
    unit_of_measurement: "Pulse"
    accuracy_decimals: 0
    icon: "mdi:pulse"
    entity_category: diagnostic
    lambda: "return id(pulse_count);"
    update_interval: 1s

# Online/Offline-Verfügbarkeit kommt aus dem retained LWT-Topic .../status
# (birth_message / will_message oben) – kein zusätzlicher status-binary_sensor nötig.

# ----------------------------------------------------------------------------
#  Live-Anzeige des Puls-Eingangs im eingebauten Web-Dashboard (Debug).
#  "Puls-Eingang aktiv" leuchtet, solange Pulse eintreffen (letzter Puls < 400 ms).
#  Getrieben aus den echten Puls-Events – pulse_meter belegt GPIO4 exklusiv, daher
#  keine zweite GPIO-Belegung auf demselben Pin möglich.
# ----------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Puls-Eingang aktiv"
    id: puls_input_active
    device_class: running
    lambda: |-
      return id(last_pulse_ms) != 0 && (millis() - id(last_pulse_ms)) < 400;

button:
  # Reset auch ueber API/ESPHome-Dashboard/Home Assistant moeglich
  - platform: template
    name: "Gesamtvolumen zuruecksetzen"
    icon: "mdi:restart"
    entity_category: config
    on_press:
      # wie beim MQTT-Reset: pulse_meter-Sitzungstotal mit nullen
      - pulse_meter.set_total_pulses:
          id: gas_flow
          value: 0
      - lambda: |-
          id(vol_total) = 0.0;
          id(last_raw) = 0.0;
      - component.update: total_vol
      - logger.log: "Gesamtvolumen via Button zurueckgesetzt"
