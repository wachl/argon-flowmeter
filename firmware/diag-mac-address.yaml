# =============================================================================
#  DIAGNOSE-Firmware – nur die Ethernet-MAC-Adresse ausgeben (z. B. für
#  Netzwerk-Freischaltung / DHCP-Reservierung). KEINE Mess-/MQTT-Funktion.
#  Einmalig flashen, MAC ablesen, danach die richtige Firmware
#  (devices/argon-flow-XX.yaml) aufspielen.
#
#  Olimex ESP32-POE2. Selbst-enthaltend (keine secrets.yaml nötig).
#  Flashen (USB):   esphome run diag-mac-address.yaml
#  ⚠️ PoE-Kabel abziehen, solange USB steckt (Board nicht galvanisch isoliert).
#
#  Ablesen – zwei Wege:
#   1) USB-Seriell (kein Netzwerkkabel nötig): das Log nach "esphome run"
#      zeigt direkt beim Boot "Ethernet-MAC: AA:BB:CC:DD:EE:FF".
#      Erneut anzeigen: Reset-Taste drücken oder "esphome logs diag-mac-address.yaml".
#   2) Mit Netzwerkkabel: alle 5 s im Log, zusätzlich Geräte-IP im Browser
#      öffnen -> Textsensor "Ethernet MAC".
# =============================================================================
esphome:
  name: argon-mac-diag
  # Läuft vor dem Ethernet-Setup, gibt die MAC also auch ohne Kabel/DHCP aus.
  on_boot:
    then:
      - lambda: |-
          auto hexval = [](char c) -> uint8_t {
            if (c >= '0' && c <= '9') return c - '0';
            if (c >= 'a' && c <= 'f') return c - 'a' + 10;
            return c - 'A' + 10;
          };
          std::string base = get_mac_address();  // Basis-MAC (eFuse) als Hex-String
          uint8_t mac[6];
          for (int i = 0; i < 6; i++)
            mac[i] = (hexval(base[2 * i]) << 4) | hexval(base[2 * i + 1]);
          // Espressif-Schema: Ethernet-MAC = Basis-MAC + 3 im letzten Oktett
          mac[5] = (uint8_t) (mac[5] + 3);
          ESP_LOGI("mac", "=====================================================");
          ESP_LOGI("mac", "Basis-MAC (WiFi): %s", get_mac_address_pretty().c_str());
          ESP_LOGI("mac", "Ethernet-MAC:     %02X:%02X:%02X:%02X:%02X:%02X",
                   mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]);
          ESP_LOGI("mac", "=====================================================");

esp32:
  board: esp32dev
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz

# Ethernet wie im Betrieb (WROVER: Takt auf GPIO0). Nur nötig, damit der
# Textsensor unten die MAC direkt aus dem Treiber meldet und das Web-Dashboard
# erreichbar ist – der USB-Seriell-Weg oben funktioniert auch ohne Kabel.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:

# Eingebautes Web-Dashboard. local: true -> Assets aus dem Gerät, kein Internet nötig.
web_server:
  port: 80
  version: 2
  local: true

# MAC direkt aus dem Ethernet-Treiber (autoritativ, sobald Netzwerk steht).
text_sensor:
  - platform: ethernet_info
    mac_address:
      name: "Ethernet MAC"
      id: eth_mac

# Sobald das Netzwerk steht, die Treiber-MAC alle 5 s zusätzlich ins Log.
interval:
  - interval: 5s
    then:
      - logger.log:
          format: "Ethernet-MAC = %s"
          args: ['id(eth_mac).state.c_str()']
