# =============================================================================
#  Vorlage für eine neue Messstelle (Gerät Nr. 17, 18, ...).
#
#  1. Nach devices/ kopieren:   cp device-template.yaml devices/gas-flow-17.yaml
#  2. Die vier substitutions unten anpassen (Nummer, Name, SP-Wert).
#  3. Flashen:                  esphome run devices/gas-flow-17.yaml
#
#  Diese Datei selbst wird NICHT geflasht (liegt bewusst außerhalb von devices/,
#  damit sie bei "alle Geräte updaten" via devices/*.yaml nicht mitläuft).
# =============================================================================
substitutions:
  # Hostname/OTA-Name des ESP32 – eindeutig, Schema gas-flow-NN
  device_name: "gas-flow-17"
  # Anzeigename (ESPHome-Dashboard / Web-UI des Geräts)
  friendly_name: "Gas Flow 17 – Anlage 17"
  # machine_id = Sensor-ID im Dashboard und in den MQTT-Topics (iwb/gas/<machine_id>/...)
  machine_id: "anlage-17"
  # Pulswertigkeit (Nl/Puls) = am Festo-SFAH eingestellter Schwellwert "SP".
  # MUSS exakt dem Sensor-SP entsprechen! (Anleitung, Abschnitt 4)
  liter_per_pulse: "1.0"

packages:
  common: !include ../gas-flowmeter.yaml
