# =============================================================================
#  DIAGNOSE-Firmware – nur GPIO4-Pegel prüfen (Verlötung/Verkabelung testen).
#  KEINE Mess-/MQTT-Funktion. Einmalig flashen, High/Low ablesen, danach die
#  richtige Firmware (devices/gas-flow-XX.yaml) aufspielen.
#
#  Olimex ESP32-POE2. Selbst-enthaltend (keine secrets.yaml nötig).
#  Flashen (USB):   esphome run diag-pin-check.yaml
#
#  Ablesen – zwei Wege:
#   1) Web-Dashboard: Geräte-IP im Browser öffnen -> "GPIO4 Pegel" HIGH/LOW.
#   2) USB-Seriell:   esphome logs diag-pin-check.yaml  -> "GPIO4 = HIGH/LOW".
#
#  Erwartung bei korrekter NPN-Verdrahtung (INPUT_PULLUP):
#   - Sensor sperrt / kein Puls  -> Leitung offen -> Pull-up -> HIGH
#   - Sensor zieht (Puls aktiv)  -> gegen 0 V     -> LOW
# =============================================================================
esphome:
  name: gas-pin-diag

esp32:
  board: esp32dev
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz

# Ethernet wie im Betrieb (WROVER: Takt auf GPIO0). Nur damit das Web-Dashboard
# erreichbar ist – ohne Netzwerk funktioniert der USB-Seriell-Weg trotzdem.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:

# Eingebautes Web-Dashboard. local: true -> Assets aus dem Gerät, kein Internet nötig.
web_server:
  port: 80
  version: 2
  local: true

# GPIO4 roh als Eingang lesen. Hier ist der Pin frei (kein pulse_meter), daher
# ist die direkte Pin-Belegung erlaubt. INPUT_PULLUP wie im Betrieb.
binary_sensor:
  - platform: gpio
    name: "GPIO4 HIGH?"
    id: gpio4_pin
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true

# Klartext HIGH/LOW zusätzlich im Dashboard.
text_sensor:
  - platform: template
    name: "GPIO4 Pegel"
    update_interval: 500ms
    lambda: 'return id(gpio4_pin).state ? std::string("HIGH") : std::string("LOW");'

# Fallback: Pegel jede Sekunde auch ins USB-Log schreiben.
interval:
  - interval: 1s
    then:
      - logger.log:
          format: "GPIO4 = %s"
          args: ['id(gpio4_pin).state ? "HIGH" : "LOW"']
